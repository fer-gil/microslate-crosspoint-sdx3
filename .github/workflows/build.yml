name: Build X3 firmware
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test parser, editor, HID, autosave and storage failure recovery
        run: sh tests/run.sh
      - name: Test Wi-Fi sync byte preservation
        run: python tests/test_sync.py
      - name: Validate Pandoc interchange syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python tests/test_pandoc.py
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Build MicroSlate for X3 UC8253
        run: pio run -e xteink_x3 | tee build-x3.log
      - name: Test real patched NimBLE disconnect callback
        run: python tests/test_nimble_disconnect.py --require-applied
      - name: Package application only
        run: |
          mkdir package
          cp .pio/build/xteink_x3/firmware.bin package/microslate-x3-uc8253-app.bin
          cp docs/X3-INSTALL-ES.md package/LEEME.md
          cp tests/acceptance.md package/prueba-markdown.md
          cp build-x3.log package/
          git rev-parse HEAD > package/SOURCE-COMMIT.txt
          cd package
          sha256sum microslate-x3-uc8253-app.bin > SHA256SUMS.txt
      - name: Upload verified build output
        uses: actions/upload-artifact@v4
        with:
          name: microslate-x3-uc8253-markdown-preview
          path: package/
          if-no-files-found: error
